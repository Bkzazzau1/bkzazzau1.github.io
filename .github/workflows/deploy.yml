name: Deploy Shemar Collection from source repository
run-name: Deploy updated Shemar Collection UI and responsive chat

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Refresh the public website when the source repository changes.
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest chatbot application
        uses: actions/checkout@v4
        with:
          repository: Bkzazzau1/shemar_chatbot
          ref: main
          path: shemar_source
          persist-credentials: false

      - name: Show source revision
        run: git -C shemar_source rev-parse HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shemar_source/shemar-chatbot-demo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: shemar_source/shemar-chatbot-demo

      - name: Test realistic chatbot conversations
        run: npm test
        working-directory: shemar_source/shemar-chatbot-demo

      - name: Build for the root GitHub Pages URL
        run: npm run build -- --base=/
        working-directory: shemar_source/shemar-chatbot-demo

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: shemar_source/shemar-chatbot-demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
